<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#263b31"><title>القرية الجبلية</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><canvas id="world" aria-label="خريطة القرية الجبلية"></canvas><header><div class="brand">⛰️ القرية الجبلية <small>نسخة تجريبية تفاعلية 0.1</small></div><div class="stats"><span>🪙 <b id="gold">0</b></span><span>🪵 <b id="wood">0</b></span><span>🌾 <b id="grain">0</b></span><span>⭐ <b id="xp">0</b> <small id="level">المستوى 1</small></span></div></header><aside id="panel"><h2 id="selectionTitle">مرحبًا بك في القرية</h2><p id="selectionText">اضغط على أحد المدرجات الزراعية لتزرع وتحصد، أو على المنزل لتطويره.</p><div id="actions"></div></aside><nav><button id="zoomIn" title="تقريب">＋</button><button id="zoomOut" title="إبعاد">－</button><button id="center" title="إعادة تمركز">⌂</button><button id="help" title="المساعدة">؟</button></nav><div id="toast" role="status"></div><footer>اسحب الخريطة للتنقل • اضغط على المدرجات للتفاعل • يُحفظ تقدمك تلقائيًا</footer></main><script src="game.js"></script></body></html>
