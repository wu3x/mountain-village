<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القرية الجبلية | مشهد تجريبي</title><style>
*{box-sizing:border-box}body{margin:0;background:#172d29;color:#f9edcf;font-family:Tahoma,Arial,sans-serif;overflow:hidden}#viewport{width:100vw;height:100dvh;touch-action:none;overflow:hidden;background:#eec88f}svg{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;right:12px;left:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}#hud>*{background:#253c34e8;border:1px solid #ebd39b77;border-radius:15px;padding:12px 16px;box-shadow:0 5px 20px #0005}#hud h1{font-size:19px;margin:0 0 5px}#hud small{font-size:11px;color:#f2dba7}.stats{font-size:13px;display:flex;gap:15px;align-items:center}#panel{position:absolute;bottom:18px;right:16px;width:min(340px,calc(100vw - 90px));background:#263e35ef;border:1px solid #e6c89288;border-radius:18px;padding:16px;box-shadow:0 8px 30px #0005}#panel h2{font-size:18px;margin:0 0 8px;color:#f2d28b}#panel p{font-size:13px;line-height:1.8;margin:0 0 12px}button{border:0;border-radius:10px;background:#e4b66d;color:#263c32;padding:10px 12px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#buttons{display:flex;flex-wrap:wrap;gap:8px}#camera{position:absolute;bottom:18px;left:16px;display:grid;gap:8px}#camera button{background:#263e35e8;color:#fff;border:1px solid #e6c89288;font-size:22px;width:46px;height:46px}#hint{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:#263e35d9;border-radius:14px;padding:8px 12px;font-size:11px;white-space:nowrap}#toast{position:absolute;top:145px;left:50%;transform:translateX(-50%);background:#263e35;padding:12px 20px;border-radius:12px;display:none}@media(max-width:650px){#hud{flex-direction:column;align-items:flex-start}#hud>*{padding:8px 12px}#hud h1{font-size:15px}#hint{top:123px;font-size:10px}#panel{padding:12px}#panel h2{font-size:15px}#panel p{font-size:11px}.stats{gap:10px}}</style></head><body>

</defs>

<g id="terrace1" class="plot" data-id="0" style="cursor:pointer"><path d="M140 670L410 630L500 694L215 752Z" fill="#6b5b47" stroke="#65523e" stroke-width="5"/><path d="M140 643L410 603L500 667L215 725Z" fill="url(#grass)" stroke="#d6bd8c" stroke-width="7"/><path d="M140 643L410 603L500 667L215 725Z" fill="url(#stones)" opacity=".22"/><g class="cropRows"></g></g>
<g id="terrace2" class="plot" data-id="1" style="cursor:pointer"><path d="M650 575L900 535L990 600L740 650Z" fill="#685b46" stroke="#65523e" stroke-width="5"/><path d="M650 550L900 510L990 575L740 625Z" fill="url(#grass)" stroke="#d6bd8c" stroke-width="7"/><g class="cropRows"></g></g>
<g id="terrace3" class="plot" data-id="2" style="cursor:pointer"><path d="M1030 460L1230 425L1320 477L1110 520Z" fill="#6b5b47" stroke="#65523e" stroke-width="5"/><path d="M1030 440L1230 405L1320 457L1110 500Z" fill="#89946d" stroke="#d6bd8c" stroke-width="7"/><text x="1160" y="460" text-anchor="middle" font-size="36">🔒</text></g>
<g transform="translate(500 565) scale(.85)"><use href="#house"/></g><g transform="translate(1080 565) scale(.65)"><use href="#house"/></g>
<g id="home" style="cursor:pointer" transform="translate(300 540) scale(.85)"><use href="#house"/></g>

<path d="M815 710Q860 680 900 714Q920 754 860 772Q802 764 815 710Z" fill="#a5c8bb" stroke="#ddd5a9" stroke-width="9"/><path d="M828 728Q860 706 892 725" fill="none" stroke="#e7eacb" stroke-width="5"/>

</g></svg></div>
<div id="hud"><div><h1>⛰️ القرية الجبلية</h1><small>تجربة المشهد الفني — تطوير منفصل</small></div><div class="stats"><span>🪙 <b id="gold">100</b></span><span>🌾 <b id="grain">0</b></span><span>⭐ <b id="xp">0</b></span></div></div>
<div id="hint">اسحب للتنقل • المس المدرجات للزراعة • المنزل للتطوير</div><div id="toast"></div><div id="panel"><h2 id="title">مرحبًا بك في القرية</h2><p id="desc">هذا مشهد فني تفاعلي منفصل عن اللعبة الأصلية. جرّب الزراعة والحصاد وحركة الكاميرا.</p><div id="buttons"></div></div><div id="camera"><button id="plus">+</button><button id="minus">−</button><button id="reset">⌂</button></div>
<script>
const $=id=>document.getElementById(id),svg=$('scene'),world=$('cameraWorld');let scale=1,tx=0,ty=0,drag=null,selected=null;let data;try{data=JSON.parse(localStorage.getItem('mountainScenePreview')||'null')}catch{}data=data||{gold:100,grain:0,xp:0,house:1,plots:[null,null]};const save=()=>localStorage.setItem('mountainScenePreview',JSON.stringify(data));function camera(){world.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}function stats(){$('gold').textContent=data.gold;$('grain').textContent=data.grain;$('xp').textContent=data.xp}function button(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=()=>{fn();save();stats();panel()};$('buttons').append(b)}function panel(){$('buttons').replaceChildren();if(selected===null){$('title').textContent='🌄 القرية الجبلية';$('desc').textContent='مشهد تجريبي جديد. المس المدرجات أو المنزل، واسحب الخريطة للتنقل.';return}if(selected==='house'){$('title').textContent='🏠 البيت الحجري — مستوى '+data.house;$('desc').textContent='تطوير البيت يكلف '+data.house*40+' عملة.';button('⬆️ تطوير',()=>{if(data.gold<data.house*40)return notify('العملات غير كافية');data.gold-=data.house*40;data.house++;data.xp+=20;notify('تم التطوير!')});return}let i=selected,p=data.plots[i];$('title').textContent='🌱 المدرج الزراعي '+(i+1);if(!p){$('desc').textContent='اختر محصولًا للزراعة، ثم انتظر نموه.';button('🌾 قمح · 5 عملات',()=>plant('قمح',5,12000));button('🌽 ذرة · 12 عملة',()=>plant('ذرة',12,22000));return}let left=Math.max(0,p.duration-(Date.now()-p.start));$('desc').textContent=left?'المحصول: '+p.name+' — متبقٍ '+Math.ceil(left/1000)+' ثانية':'المحصول جاهز للحصاد!';if(!left)button('🧺 حصاد المحصول',()=>{data.plots[i]=null;data.grain+=10;data.xp+=15;notify('تم الحصاد!')});button('💰 بيع 5 محاصيل',()=>{if(data.grain<5)return notify('المخزون غير كافٍ');data.grain-=5;data.gold+=15})}function plant(name,cost,duration){if(data.gold<cost)return notify('العملات غير كافية');data.gold-=cost;data.plots[selected]={name,start:Date.now(),duration};notify('تمت الزراعة!')}document.querySelectorAll('.plot').forEach(el=>el.addEventListener('click',()=>{if(drag?.moved)return;let i=+el.dataset.id;if(i>1)return notify('هذه الأرض ستفتح في مرحلة لاحقة');selected=i;panel()}));$('home').addEventListener('click',()=>{if(drag?.moved)return;selected='house';panel()});function zoom(m){scale=Math.max(.7,Math.min(2.3,scale*m));camera()}$('plus').onclick=()=>zoom(1.2);$('minus').onclick=()=>zoom(1/1.2);$('reset').onclick=()=>{scale=1;tx=0;ty=0;camera()};svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;if(drag.moved){const box=svg.getBoundingClientRect();tx=drag.tx+dx*1400/box.width;ty=drag.ty+dy*850/box.height;camera()}});svg.addEventListener('pointerup',()=>{setTimeout(()=>drag=null,0)});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.92)},{passive:false});
function draw(t){const g=$('movingGoat'),f=$('movingFarmer');g.setAttribute('transform',`translate(${870+Math.sin(t/1700)*55} 790) scale(.9)`);f.setAttribute('transform',`translate(${705+Math.sin(t/2100)*75} 690)`);document.querySelectorAll('.cropRows').forEach((g,i)=>{const p=data.plots[i];let progress=p?Math.min(1,(Date.now()-p.start)/p.duration):0;let base=i===0?[210,664]:[720,562];let s='';for(let j=0;j<24;j++){let x=base[0]+(j%8)*29+(Math.floor(j/8)*13),y=base[1]+Math.floor(j/8)*16-(j%8)*4;if(p){let h=8+progress*22;s+=`<path d="M${x} ${y}v-${h}" stroke="${progress>.85?'#e5c86e':'#477a43'}" stroke-width="4"/><path d="M${x} ${y-h+8}l-7 -7M${x} ${y-h+4}l7 -7" stroke="#91b95d" stroke-width="3"/>`}else{s+=`<path d="M${x-7} ${y}l15 -3" stroke="#63864e" stroke-width="3"/>`}}g.innerHTML=s});requestAnimationFrame(draw)}setInterval(()=>{if(typeof selected==='number')panel()},1000);stats();panel();requestAnimationFrame(draw);
</script></body></html>
